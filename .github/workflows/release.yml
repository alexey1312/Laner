name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Replace version placeholder
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/g" Sources/SwiftlaneKit/SwiftlaneKit.swift

      - name: Build for Apple Silicon
        run: swift build -c release --arch arm64

      - name: Create release archive
        run: |
          tar -czf swiftlane-${{ github.ref_name }}-macos-arm64.tar.gz \
            -C .build/arm64-apple-macosx/release swiftlane

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: swiftlane-${{ github.ref_name }}-macos-arm64.tar.gz
          generate_release_notes: true
