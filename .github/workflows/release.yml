name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_GITHUB_ATTESTATIONS: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            arch: arm64
            build-path: arm64-apple-macosx/release
          - os: ubuntu-latest
            platform: linux-x64
            arch: x86_64
            build-path: x86_64-unknown-linux-gnu/release
            container: swift:6.1

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          apt-get update
          apt-get install -y curl

      - uses: actions/checkout@v6

      - name: Select Xcode 16.4 (macOS)
        if: matrix.platform == 'macos-arm64'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add xcsift to PATH (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          mise install xcsift
          mise where xcsift >> "$GITHUB_PATH"

      - name: Replace version placeholder
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/g" Sources/LanerKit/LanerKit.swift
          else
            sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" Sources/LanerKit/LanerKit.swift
          fi

      - name: Build release binary
        run: swift build -c release --arch ${{ matrix.arch }} 2>&1 | xcsift

      - name: Create release archive
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Create directory structure
          mkdir -p release-package/bin
          mkdir -p release-package/lib/laner/Sources

          # Copy binary
          cp .build/${{ matrix.build-path }}/laner release-package/bin/

          # Copy DSL sources (required for manifest compilation)
          cp -r Sources/LanerDSL release-package/lib/laner/Sources/
          cp -r Sources/LanerKit release-package/lib/laner/Sources/
          cp -r Sources/LanerMatch release-package/lib/laner/Sources/

          # Create bundled Package.swift for manifest compilation
          cat > release-package/lib/laner/Package.swift << 'PACKAGE_EOF'
          // swift-tools-version:6.0
          import PackageDescription

          let package = Package(
              name: "Laner",
              platforms: [.macOS(.v13)],
              products: [
                  .library(name: "LanerDSL", targets: ["LanerDSL"]),
              ],
              dependencies: [
                  .package(url: "https://github.com/apple/swift-log", from: "1.5.0"),
                  .package(url: "https://github.com/apple/swift-crypto", from: "3.0.0"),
                  .package(url: "https://github.com/swift-server/async-http-client", from: "1.20.0"),
              ],
              targets: [
                  .target(
                      name: "LanerDSL",
                      dependencies: [
                          "LanerKit",
                          "LanerMatch",
                          .product(name: "Logging", package: "swift-log"),
                      ]
                  ),
                  .target(
                      name: "LanerKit",
                      dependencies: [
                          .product(name: "Logging", package: "swift-log"),
                      ]
                  ),
                  .target(
                      name: "LanerMatch",
                      dependencies: [
                          "LanerKit",
                          .product(name: "Logging", package: "swift-log"),
                          .product(name: "Crypto", package: "swift-crypto"),
                          .product(name: "AsyncHTTPClient", package: "async-http-client"),
                      ]
                  ),
              ]
          )
          PACKAGE_EOF

          # Create VERSION file for version validation
          echo "$VERSION" > release-package/VERSION

          # Create archive with new structure
          tar -czf Laner-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz \
            -C release-package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laner-${{ matrix.platform }}
          path: Laner-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/Laner-*.tar.gz
          generate_release_notes: true
