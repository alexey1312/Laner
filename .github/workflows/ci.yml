name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - name: Check formatting
        run: mise run format-check

      - name: Lint
        run: mise run lint

  build-macos:
    name: Build & Test (macOS)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - name: Build
        run: swift build 2>&1 | xcsift -f toon --toon-key-folding safe

      - name: Run tests
        run: swift test 2>&1 | xcsift -f toon --toon-key-folding safe

  build-linux:
    name: Build (Linux)
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl

      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - name: Build
        run: swift build 2>&1 | xcsift -f toon --toon-key-folding safe

      - name: Run tests
        run: swift test 2>&1 | xcsift -f toon --toon-key-folding safe
