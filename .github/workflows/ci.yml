name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Build
        run: swift build 2>&1 | xcbeautify

      - name: Run tests
        run: swift test 2>&1 | xcbeautify

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl

      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Build
        run: swift build 2>&1 | xcbeautify

      - name: Run tests
        run: swift test 2>&1 | xcbeautify
