included:
  - Sources
  - Tests

excluded:
  - .build
  - Packages

disabled_rules:
  - trailing_comma
  - todo
  - opening_brace
  - superfluous_disable_command
  - blanket_disable_command
  - trailing_whitespace
  - file_length
  - inclusive_language
  - function_parameter_count
  - force_cast
  - optional_data_string_conversion
  - non_optional_string_data_conversion

opt_in_rules:
  - empty_count

line_length:
  warning: 120
  error: 200
  ignores_comments: true

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - to
  allowed_symbols:
    - _

nesting:
  type_level:
    warning: 4

large_tuple:
  warning: 4
  error: 5

function_body_length:
  warning: 120
  error: 180

cyclomatic_complexity:
  warning: 20
  error: 30

type_body_length:
  warning: 300
  error: 800
